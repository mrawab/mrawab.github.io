<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
            background-color: #1B1212;
            color: aliceblue;
            animation: appear 0.5s ease-in;
        }
        body a,p{
            color: aliceblue;
            font-size: 20px;
            font-style: italic;
        }
        body a:hover{
            color:aquamarine;
            text-decoration: underline;
            transform: translateY(-20%);
        }
        @keyframes appear {
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <h1><b>Oh Sorry!</b></h1>
    <h3>The page was deleted</h3>
    <p>Would you like to go to <a href="https://awabazhari.netlify.app">new one</a>?</p>
</body>
</html>
