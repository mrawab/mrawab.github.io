<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        background-color: white;
        background-image: url("main-background.webp");
        background-position: center;
        background-size: cover;
        background-repeat: main-background.webpno-repeat;
        background-attachment: fixed;
        color: aliceblue;
        animation: appear 0.5s ease-in;
      }
      body a,
      p {
        color: aliceblue;
        font-size: 20px;
        transition: all 0.5s ease;
      }
      body a:hover{
        background:linear-gradient(to right,rgb(236, 240, 3),rgb(14, 243, 7));
        background-clip: text;
        color: transparent;
        transform: scale(2);
      }
      div{
        left:50%; top:50%;
        transform:translate(50%,50%);
        background-color: rgba(255,255,255,0.05);
        backdrop-filter: blur(5px);
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: column;
        width: 400px;
        padding: 20px;
        place-items:center;
        border-radius: 25px;
        animation: border-effect 5s ease-in-out;
      }
      h1, h2{
        position: relative;
        text-align:center;
      }
      @keyframes appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }  
        @keyframes border-effect {
        0% {
          border-radius: 0px;
        }
        20% {
            border-radius: 25px;
        }
        40% {
            border-radius: 10px;
        }
        60% {
            border-radius: 30px;
        }
        80% {
            border-radius: 5px;
        }
        100% {
            border-radius: 25px;
        }

      }
    </style>
  </head>
  <body>
    <div>
        <h1><b>Oh Sorry!</b></h1>
        <h1><b>404</b></h1>
        <h3>Sounds like the page not available</h3>
        <p>Would like to go <a href="main.html">home</a>?</p>
    </div>
  </body>
</html>
