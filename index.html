  .dots{
     display:flex;
     justify-content: center;
     align-items: center;
     flex-direction: row;
     width: 100%;
     min-height: 100vh;
     background-color: rgba(255, 255, 255, 0.01);
     backdrop-filter: blur(5px);
   }
  .dots span:nth-child(1){
    border-radius:50%;
    border:8px solid whitesmoke !important;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 0.5s infinite linear;
  } 
   .dots span:nth-child(2){
    border-radius:50%;
    border:8px solid whitesmoke !important;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 1s 0.5s infinite linear;
  } 
   .dots span:nth-child(3){
    border-radius:50%;
    border:8px solid whitesmoke !important;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 0.5s infinite linear;
  }
    @keyframes dots{
      0%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-60%);
      }
      100%{
        transform:translateY(0);
      }
    }
    @keyframes fade-out{
      from{
        opacity:1;
      }
      to{
        opacity:0;
        transform:translate(-50%,-100%);
      }
    }
