<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading</title>
 
  <style>
    *{
      margin:0;
      padding: 0;
      box-sizing:border-box;
      background-color:#343434 ;
    }
   .container{
      opacity:1;
      animation:fade-out 1s 3.2s ease-out;
      position:fixed;
      top:50%;
      left:50%;
      display:flex;
      justify-content:center ;
      align-items:center;
      flex-direction:column;
      transform : translate(-50%,-50%);
    }
  .dots{
     margin-top:50px;
     display:flex;
     flex-direction: row;
   }
  .dots span:nth-child(1){
    border-radius:50%;
    border:8px solid whitesmoke;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 0.5s infinite linear;
  } 
   .dots span:nth-child(2){
    border-radius:50%;
    border:8px solid whitesmoke;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 1s 0.5s infinite linear;
  } 
   .dots span:nth-child(3){
    border-radius:50%;
    border:8px solid whitesmoke;
    height:4px;
    margin:10px;
    width:4px;
    animation:dots 0.5s infinite linear;
  }
    @keyframes dots{
      0%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-60%);
      }
      100%{
        transform:translateY(0);
      }
    }
    @keyframes fade-out{
      from{
        opacity:1;
      }
      to{
        opacity:0;
        transform:translate(-50%,-100%);
      }
    }
  </style>
</head>
<body>
 <div class="container"><div class="dots"><span></span><span></span><span></span></div></div>

<script defer>
  setTimeout(() => {
    window.location.href = "main.html";
  }, 4000);
</script>
</body>

</html>
