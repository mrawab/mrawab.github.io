<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="website_icon.ico" type="image/x-icon">
</head>

<body class="contact-body">
  <main class="form-container">
    <div class="form">
      <form id="form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="cb7aaa96-b5ca-4e17-a172-030a1636757d">

<input type="hidden" name="redirect" value="https://awabazhari.netlify.app/submit.html">

<input id = "message" type="hidden" name="subject">
        <h1>Enter Info</h1>

<input type="checkbox" name="botcheck" class="hidden" style="display: none;">
        
        <div class="input-box">
          <input type="text" maxlength="50" name="username" id="username" placeholder="Name" required>
          <i class="fa-solid fa-user"></i>
        </div>
        
        <div class="input-box">
          <input type="email" name="email" placeholder="Email" required>
          <i class="fa-solid fa-envelope"></i>
        </div>
        
        <div id="textbox" class="input-box">
          <textarea id="" cols="30" rows="10" name="message" placeholder="Message" required></textarea>
          <i class="fa-solid fa-comment"></i>
        </div>
        
        <div class="form-buttons">
          <button style="font-family: "Jersey 15", serif;" type="submit">Submit</button>
          <a href="loading.html">Home</a>
        </div>
      </form>
    </div>
  </main>
  <script defer>
document.getElementById("form").addEventListener("submit",function() {
    let username = document.getElementById("username").value;
    document.getElementById("message").value = `Message from ${username}`;
  });
</script>
</body>

</html>
