<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="test_style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="contat-body">
  <main>
    <div class="form">
      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="cb7aaa96-b5ca-4e17-a172-030a1636757d">

<input type="hidden" name="redirect" value="https://awabazhari.netlify.app/submit.html">

<input type="hidden" name="subject" value="message from ${username}">
        <h1>Enter Info</h1>
        
        <div class="input-box">
          <input type="text" maxlength="50" name="username" placeholder="Name" required>
          <i class="fa-solid fa-user"></i>
        </div>
        
        <div class="input-box">
          <input type="email" name="email" placeholder="Email" required>
          <i class="fa-solid fa-envelope"></i>
        </div>
        
        <div id="textbox" class="input-box">
          <textarea id="" cols="30" rows="10" name="message" placeholder="Message" required></textarea>
          <i class="fa-solid fa-comment"></i>
        </div>
        
        <div class="form-buttons">
          <button type="submit">Submit</button>
          <a href="test.html">Home</a>
        </div>
      </form>
    </div>
  </main>
</body>

</html>
